name: Public repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify public files and release integrity
        run: python source/tools/check_public_repo.py
      - name: Install regression test dependencies
        run: python -m pip install -r source/requirements-test.txt
      - name: Check packaging and portable Lua fixture
        run: python source/tools/test_public_release.py
      - name: Check PAK-only release policy with mocked official tools
        run: python source/tools/test_pak_release.py
      - name: Check pinned character-name fixtures
        run: python source/tools/test_namegen_semantics.py --project source --mod mods/FU_Japanese --fixtures source/tests/namegen_fixtures
